<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudFinOps Sentinel — Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/dashboard.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛰️</text></svg>">
</head>
<body>

<div class="backdrop"></div>

<!-- ================= LOGIN ================= -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form" autocomplete="off">
    <span class="corners"></span>
    <h1>CLOUDFINOPS SENTINEL</h1>
    <p class="gate-sub" data-i18n="auth.prompt"></p>
    <input type="password" id="gate-token" placeholder="••••••••••••" autocomplete="current-password" required>
    <button class="btn" type="submit" data-i18n="auth.enter"></button>
    <p class="gate-error" id="gate-error" hidden></p>
  </form>
</div>
<div class="scanline"></div>

<div class="deck" id="deck" hidden>

  <!-- ================= HEADER ================= -->
  <header class="masthead">
    <div class="status-strip">
      <span class="pill info" id="pill-project"><span class="dot"></span> <b>—</b></span>
      <span class="pill" id="pill-source">SOURCE <b>—</b></span>
      <span class="pill" id="pill-model">ENGINE <b>—</b></span>
      <span class="pill" id="pill-mode">MODE <b>—</b></span>
    </div>

    <div class="brand-block">
      <h1>CLOUDFINOPS SENTINEL</h1>
      <div class="sub" data-i18n="brand.sub"></div>
    </div>

    <div class="status-strip right">
      <div class="lang" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="es" type="button">ES</button>
      </div>
      <span class="pill ok" id="pill-agent"><span class="dot live"></span> STANDBY</span>
      <span class="pill" id="pill-clock">--:--:--</span>
      <button class="btn ghost" id="btn-logout" type="button" data-i18n="btn.logout"></button>
      <button class="btn ghost" id="btn-preflight" type="button" data-i18n="btn.preflight"></button>
      <button class="btn ghost" id="btn-report" type="button" data-i18n="btn.report"></button>
      <button class="btn" id="btn-audit" type="button" data-i18n="btn.audit"></button>
    </div>
  </header>

  <!-- ================= GRID ================= -->
  <div class="grid">

    <!-- ---------- LEFT ---------- -->
    <div class="col col-left">

      <section class="panel">
        <span class="corners"></span>
        <div class="panel-head">
          <div class="panel-title" data-i18n="panel.ranking"></div>
          <div class="panel-note" data-i18n="panel.ranking.note"></div>
        </div>
        <div class="panel-body">
          <div class="rank" id="rank-list"></div>
          <div class="legend">
            <span><i style="background:linear-gradient(90deg,#4d7cfe,#3fe0ff)"></i><b data-i18n="legend.allocated"></b></span>
            <span><i style="background:linear-gradient(90deg,#ff5f79,#ffc44d)"></i><b data-i18n="legend.wasted"></b></span>
          </div>
        </div>
      </section>

      <section class="panel">
        <span class="corners"></span>
        <div class="panel-head">
          <div class="panel-title" data-i18n="panel.spend"></div>
          <div class="panel-note" data-i18n="panel.spend.note"></div>
        </div>
        <div class="panel-body">
          <div class="donut-wrap">
            <svg id="donut-spend" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Spend by resource state"></svg>
            <div class="donut-legend" id="donut-spend-legend"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <span class="corners"></span>
        <div class="panel-head">
          <div class="panel-title" data-i18n="panel.stream"></div>
          <div class="panel-note" id="event-count">0 events</div>
        </div>
        <div class="panel-body">
          <div class="stream" id="stream"></div>
        </div>
      </section>

    </div>

    <!-- ---------- CENTER ---------- -->
    <div class="col col-mid">

      <section>
        <div class="kpi-row">
          <div class="kpi">
            <div class="kpi-label" data-i18n="kpi.spend"></div>
            <div class="kpi-value cyan" id="kpi-spend">0<span class="unit">USD</span></div>
            <div class="kpi-foot"><span class="down" id="kpi-waste">$0</span> <span data-i18n="kpi.waste"></span></div>
          </div>
          <div class="kpi">
            <div class="kpi-label" data-i18n="kpi.savings"></div>
            <div class="kpi-value" id="kpi-savings">0<span class="unit">USD</span></div>
            <div class="kpi-foot"><span class="up" id="kpi-actions">0</span> <span data-i18n="kpi.actions"></span></div>
          </div>
        </div>
        <div class="micro-row">
          <div class="micro"><div class="v" id="m-resources">0</div><div class="k" data-i18n="micro.resources"></div></div>
          <div class="micro"><div class="v" id="m-anomalies">0</div><div class="k" data-i18n="micro.anomalies"></div></div>
          <div class="micro"><div class="v" id="m-pending">0</div><div class="k" data-i18n="micro.pending"></div></div>
          <div class="micro"><div class="v" id="m-audits">0</div><div class="k" data-i18n="micro.audits"></div></div>
        </div>
      </section>

      <section class="panel topo-panel">
        <span class="corners"></span>
        <div class="panel-head">
          <div class="tabs" role="tablist">
            <button class="tab active" id="tab-topology" role="tab" aria-selected="true" data-i18n="tab.topology"></button>
            <button class="tab" id="tab-inventory" role="tab" aria-selected="false" data-i18n="tab.inventory"></button>
            <button class="tab" id="tab-trace" role="tab" aria-selected="false" data-i18n="tab.trace"></button>
          </div>
          <div class="panel-note" id="topo-note">—</div>
        </div>
        <div class="panel-body" id="view-topology" style="overflow:hidden">
          <div class="topo" id="topo"></div>
        </div>
        <div class="panel-body" id="view-inventory" hidden>
          <table class="inv" id="inventory">
            <thead>
              <tr>
                <th data-i18n="col.resource"></th><th data-i18n="col.type"></th><th data-i18n="col.location"></th><th data-i18n="col.spec"></th>
                <th data-i18n="col.usage"></th>
                <th data-i18n="col.cost"></th><th data-i18n="col.waste"></th><th data-i18n="col.state"></th><th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="panel-body" id="view-trace" hidden>
          <div class="trace" id="trace"></div>
        </div>
        <div class="problems" id="problems" style="display:none"></div>
      </section>

      <section class="panel">
        <span class="corners"></span>
        <div class="panel-head">
          <div class="panel-title" data-i18n="panel.approvals"></div>
          <div class="panel-note" id="approval-note">Level 2 actions</div>
        </div>
        <div class="panel-body">
          <div class="approvals" id="approvals"></div>
        </div>
      </section>

    </div>

    <!-- ---------- RIGHT ---------- -->
    <div class="col col-right">

      <section class="panel">
        <span class="corners"></span>
        <div class="panel-head">
          <div class="panel-title" data-i18n="panel.health"></div>
          <div class="panel-note" data-i18n="panel.health.note"></div>
        </div>
        <div class="panel-body">
          <div class="donut-wrap">
            <svg id="donut-health" width="118" height="118" viewBox="0 0 120 120" role="img" aria-label="Resource health mix"></svg>
            <div class="donut-legend" id="donut-health-legend"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <span class="corners"></span>
        <div class="panel-head">
          <div class="panel-title" data-i18n="panel.trend"></div>
          <div class="panel-note">4h · fleet avg</div>
        </div>
        <div class="panel-body" style="overflow:hidden">
          <svg class="chart" id="chart-trend" role="img" aria-label="Fleet CPU and memory utilization over time"></svg>
        </div>
      </section>

      <section class="panel">
        <span class="corners"></span>
        <div class="panel-head">
          <div class="panel-title" data-i18n="panel.radar"></div>
          <div class="panel-note" id="radar-score">—</div>
        </div>
        <div class="panel-body" style="overflow:hidden">
          <svg class="chart" id="chart-radar" role="img" aria-label="Efficiency score across six dimensions"></svg>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- ================= MODAL ================= -->
<div class="modal-bg" id="modal" hidden>
  <div class="modal">
    <button class="close" id="modal-close" type="button" aria-label="Close">&times;</button>
    <h3 id="modal-title">Last Audit Report</h3>
    <div class="report" id="modal-body"></div>
  </div>
</div>

<!-- ================= RESOURCE DRAWER ================= -->
<div class="drawer-bg" id="drawer" hidden>
  <aside class="drawer" role="dialog" aria-labelledby="drawer-title">
    <button class="close" id="drawer-close" type="button" aria-label="Close">&times;</button>
    <div class="drawer-head">
      <h3 id="drawer-title">—</h3>
      <div class="drawer-sub" id="drawer-sub"></div>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</div>

<div class="toasts" id="toasts"></div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
